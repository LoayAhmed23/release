<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborative Clicker - Chat App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }
    
    .game-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .title {
      font-size: 2em;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    
    .nav-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .game-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .stat-number {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      color: #FFD700;
    }
    
    .stat-label {
      font-size: 1.1em;
      opacity: 0.9;
    }
    
    .click-section {
      margin: 40px 0;
    }
    
    .click-button {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #ff6b6b, #ee5a24);
      color: white;
      font-size: 2em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    
    .click-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }
    
    .click-button:active {
      transform: translateY(-2px) scale(0.95);
    }
    
    .click-button.clicked {
      animation: clickPulse 0.3s ease-out;
    }
    
    @keyframes clickPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .progress-section {
      margin: 40px 0;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
      position: relative;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      border-radius: 15px;
      transition: width 0.3s ease;
      position: relative;
    }
    
    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      font-size: 1.1em;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      z-index: 1;
    }
    
    .leaderboard {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      margin-top: 40px;
    }
    
    .leaderboard h3 {
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
    }
    
    .rank {
      font-weight: bold;
      font-size: 1.2em;
      color: #FFD700;
      width: 30px;
    }
    
    .username {
      flex-grow: 1;
      text-align: left;
      margin-left: 15px;
    }
    
    .clicks {
      font-weight: bold;
      color: #4ECDC4;
    }
    
    .reset-celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .celebration-content {
      background: linear-gradient(145deg, #ff6b6b, #ee5a24);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      animation: celebrationPulse 1s ease-in-out infinite alternate;
    }
    
    @keyframes celebrationPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    
    .celebration-title {
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }
    
    .celebration-message {
      font-size: 1.5em;
      margin-bottom: 30px;
    }
    
    .click-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
    
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
      }
      
      .click-button {
        width: 200px;
        height: 200px;
        font-size: 1.5em;
      }
      
      .game-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">🚀 Collaborative Clicker</div>
      <div class="nav-buttons">
        <a href="/index.html" class="nav-btn">💬 Friends</a>
        <button id="logout-btn" class="nav-btn">🚪 Logout</button>
      </div>
    </div>
    
    <div class="game-stats">
      <div class="stat-card">
        <div id="click-count" class="stat-number">0</div>
        <div class="stat-label">Total Clicks</div>
      </div>
      <div class="stat-card">
        <div id="total-resets" class="stat-number">0</div>
        <div class="stat-label">Times Reset</div>
      </div>
      <div class="stat-card">
        <div id="remaining-clicks" class="stat-number">10000</div>
        <div class="stat-label">Clicks to Reset</div>
      </div>
    </div>
    
    <div class="progress-section">
      <h3>Progress to 10,000</h3>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        <div id="progress-text" class="progress-text">0 / 10000</div>
      </div>
    </div>
    
    <div class="click-section">
      <button id="click-button" class="click-button">
        CLICK ME!<br>
        <small>Work together!</small>
      </button>
    </div>
    
    <div class="leaderboard">
      <h3>🏆 Top Contributors</h3>
      <div id="leaderboard-list" class="leaderboard-list">
        <div style="text-align: center; opacity: 0.7;">Loading...</div>
      </div>
    </div>
  </div>
  
  <div id="reset-celebration" class="reset-celebration">
    <div class="celebration-content">
      <div class="celebration-title">🎉 AMAZING! 🎉</div>
      <div class="celebration-message">You helped reach 10,000 clicks!<br>The counter has reset - let's do it again!</div>
      <button onclick="hideResetCelebration()" class="nav-btn">Continue Playing</button>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    let gameState = { clickCount: 0, totalResets: 0 };
    let pollingInterval;
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Check authentication
      const user = await checkAuth();
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      
      // Setup logout
      setupLogout();
      
      // Initialize game
      await loadGameState();
      await loadLeaderboard();
      
      // Setup click button
      setupClickButton();
      
      // Start polling for updates
      startPolling();
    });
    
    async function loadGameState() {
      try {
        const response = await authFetch('/api/game/state');
        if (!response.ok) throw new Error('Failed to load game state');
        
        gameState = await response.json();
        updateUI();
      } catch (err) {
        console.error('Error loading game state:', err);
      }
    }
    
    async function loadLeaderboard() {
      try {
        const response = await authFetch('/api/game/leaderboard');
        if (!response.ok) throw new Error('Failed to load leaderboard');
        
        const leaderboard = await response.json();
        displayLeaderboard(leaderboard);
      } catch (err) {
        console.error('Error loading leaderboard:', err);
      }
    }
    
    function setupClickButton() {
      const clickButton = document.getElementById('click-button');
      
      clickButton.addEventListener('click', async (e) => {
        // Add click animation
        clickButton.classList.add('clicked');
        setTimeout(() => clickButton.classList.remove('clicked'), 300);
        
        // Create ripple effect
        createRipple(e);
        
        try {
          const response = await authFetch('/api/game/click', { method: 'POST' });
          if (!response.ok) throw new Error('Failed to register click');
          
          const result = await response.json();
          
          if (result.resetTriggered) {
            showResetCelebration();
          }
          
          gameState.clickCount = result.clickCount;
          updateUI();
          
          // Reload leaderboard after click
          await loadLeaderboard();
        } catch (err) {
          console.error('Error registering click:', err);
        }
      });
    }
    
    function createRipple(e) {
      const button = e.currentTarget;
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      
      const ripple = document.createElement('span');
      ripple.className = 'click-ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      button.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 600);
    }
    
    function updateUI() {
      document.getElementById('click-count').textContent = gameState.clickCount.toLocaleString();
      document.getElementById('total-resets').textContent = gameState.totalResets.toLocaleString();
      document.getElementById('remaining-clicks').textContent = (10000 - gameState.clickCount).toLocaleString();
      
      // Update progress bar
      const percentage = (gameState.clickCount / 10000) * 100;
      document.getElementById('progress-fill').style.width = percentage + '%';
      document.getElementById('progress-text').textContent = `${gameState.clickCount.toLocaleString()} / 10,000`;
    }
    
    function displayLeaderboard(leaderboard) {
      const list = document.getElementById('leaderboard-list');
      
      if (leaderboard.length === 0) {
        list.innerHTML = '<div style="text-align: center; opacity: 0.7;">No clicks yet - be the first!</div>';
        return;
      }
      
      list.innerHTML = leaderboard.map((user, index) => `
        <div class="leaderboard-item">
          <div class="rank">#${index + 1}</div>
          <div class="username">${user.username}</div>
          <div class="clicks">${user.total_clicks} clicks</div>
        </div>
      `).join('');
    }
    
    function showResetCelebration() {
      document.getElementById('reset-celebration').style.display = 'flex';
      
      // Auto-hide after 5 seconds
      setTimeout(hideResetCelebration, 5000);
    }
    
    function hideResetCelebration() {
      document.getElementById('reset-celebration').style.display = 'none';
    }
    
    function startPolling() {
      // Poll every 3 seconds for updates
      pollingInterval = setInterval(async () => {
        await loadGameState();
      }, 3000);
    }
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }
    });
  </script>
</body>
</html>
